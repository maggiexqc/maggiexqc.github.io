<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cozy Cafe</title>
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <!-- Top Status Bar -->
    <div class="status-bar">
        <div class="coin-display">
            <div class="coin-icon">$</div>
            <span id="coin-count">500</span>
        </div>
        <div class="level-display">
            <div class="level-info">
                <span class="level-label">Lv.</span>
                <span id="level-number">1</span>
            </div>
            <div class="xp-bar-container">
                <div class="xp-bar" id="xp-bar"></div>
            </div>
            <span class="xp-text" id="xp-text">0/100</span>
        </div>
    </div>

    <!-- Main Cafe Area -->
    <div class="cafe-container">
        <div class="cafe-floor" id="cafe-floor">
            <!-- Grid cells will be generated by JavaScript -->
        </div>
    </div>

    <!-- Bottom Menu Bar -->
    <div class="bottom-bar">
        <button class="menu-btn" id="menu-btn">
            <div class="menu-icon">&#9776;</div>
            <span>Menu</span>
        </button>
        <button class="menu-btn" id="furniture-btn">
            <div class="menu-icon">&#9635;</div>
            <span>Furniture</span>
        </button>
        <button class="menu-btn" id="decor-btn">
            <div class="menu-icon">&#10047;</div>
            <span>Decor</span>
        </button>
    </div>

    <!-- Menu Modal (Baked Goods) -->
    <div class="modal" id="menu-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Baked Goods Menu</h2>
                <button class="close-btn" id="close-menu">&times;</button>
            </div>
            <div class="modal-body">
                <div class="menu-grid">
                    <div class="menu-item" data-item="croissant">
                        <div class="item-placeholder croissant-icon">&#127798;</div>
                        <div class="item-name">Croissant</div>
                        <div class="item-price">$5</div>
                        <div class="item-xp">+2 XP</div>
                    </div>
                    <div class="menu-item" data-item="muffin">
                        <div class="item-placeholder muffin-icon">&#127856;</div>
                        <div class="item-name">Muffin</div>
                        <div class="item-price">$4</div>
                        <div class="item-xp">+1 XP</div>
                    </div>
                    <div class="menu-item" data-item="cake">
                        <div class="item-placeholder cake-icon">&#127856;</div>
                        <div class="item-name">Cake Slice</div>
                        <div class="item-price">$8</div>
                        <div class="item-xp">+4 XP</div>
                    </div>
                    <div class="menu-item" data-item="cookie">
                        <div class="item-placeholder cookie-icon">&#127850;</div>
                        <div class="item-name">Cookie</div>
                        <div class="item-price">$3</div>
                        <div class="item-xp">+1 XP</div>
                    </div>
                    <div class="menu-item" data-item="donut">
                        <div class="item-placeholder donut-icon">&#127849;</div>
                        <div class="item-name">Donut</div>
                        <div class="item-price">$4</div>
                        <div class="item-xp">+2 XP</div>
                    </div>
                    <div class="menu-item" data-item="coffee">
                        <div class="item-placeholder coffee-icon">&#9749;</div>
                        <div class="item-name">Coffee</div>
                        <div class="item-price">$6</div>
                        <div class="item-xp">+3 XP</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Furniture Modal -->
    <div class="modal" id="furniture-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Furniture</h2>
                <button class="close-btn" id="close-furniture">&times;</button>
            </div>
            <div class="modal-body">
                <div class="furniture-grid">
                    <div class="furniture-item" data-furniture="table" data-cost="50">
                        <div class="furniture-placeholder table-icon"></div>
                        <div class="furniture-name">Table</div>
                        <div class="furniture-cost">$50</div>
                    </div>
                    <div class="furniture-item" data-furniture="chair" data-cost="25">
                        <div class="furniture-placeholder chair-icon"></div>
                        <div class="furniture-name">Chair</div>
                        <div class="furniture-cost">$25</div>
                    </div>
                    <div class="furniture-item" data-furniture="counter" data-cost="100">
                        <div class="furniture-placeholder counter-icon"></div>
                        <div class="furniture-name">Counter</div>
                        <div class="furniture-cost">$100</div>
                    </div>
                    <div class="furniture-item" data-furniture="coffee-machine" data-cost="150">
                        <div class="furniture-placeholder machine-icon"></div>
                        <div class="furniture-name">Coffee Machine</div>
                        <div class="furniture-cost">$150</div>
                    </div>
                    <div class="furniture-item" data-furniture="display-case" data-cost="75">
                        <div class="furniture-placeholder display-icon"></div>
                        <div class="furniture-name">Display Case</div>
                        <div class="furniture-cost">$75</div>
                    </div>
                    <div class="furniture-item" data-furniture="plant" data-cost="30">
                        <div class="furniture-placeholder plant-icon"></div>
                        <div class="furniture-name">Plant</div>
                        <div class="furniture-cost">$30</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <p class="hint-text">Tap an item, then tap a grid cell to place it</p>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <script src="js/game.js"></script>
</body>
</html>
